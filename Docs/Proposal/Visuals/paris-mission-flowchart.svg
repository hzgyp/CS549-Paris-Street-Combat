<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="405" viewBox="0 0 1300 405" role="img" aria-labelledby="title desc">
<title id="title">Paris Street Combat staged mission flow</title>
<desc id="desc">Proposed flow: start or resume, pursue a current Reach or Clear objective until its condition passes, advance progress and save at selected safe boundaries if configured, then continue to the next objective or complete. Player death leads to retry from the latest checkpoint or the start when none exists. Objective order, map locations and checkpoint sites remain open. Saving does not automatically heal, refill or revive.</desc>
<rect width="1300" height="405" fill="white"/>
<text x="650" y="20" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142636">Proposed flow: objective order, locations and checkpoint sites remain open</text>
<rect x="25" y="53" width="215" height="112" rx="10" fill="#F0F5FA" stroke="#557A99" stroke-width="2"/>
<text x="132.5" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142636">START / RESUME</text>
<text x="132.5" y="114" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">Initial or saved</text>
<text x="132.5" y="141" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">mission state</text>
<rect x="285" y="53" width="340" height="112" rx="10" fill="#F0F5FA" stroke="#557A99" stroke-width="2"/>
<text x="455.0" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#142636">CURRENT OBJECTIVE</text>
<text x="455.0" y="114" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">Reach location or clear group</text>
<text x="455.0" y="141" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">Continue until condition passes</text>
<rect x="670" y="53" width="305" height="112" rx="10" fill="#FFF6E2" stroke="#B48A33" stroke-width="2"/>
<text x="822.5" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#142636">PROGRESS UPDATE</text>
<text x="822.5" y="114" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">Advance objective</text>
<text x="822.5" y="141" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">Save if configured</text>
<rect x="1030" y="53" width="240" height="112" rx="10" fill="#EAF5EF" stroke="#53856A" stroke-width="2"/>
<text x="1150.0" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#142636">COMPLETE</text>
<text x="1150.0" y="114" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">Final objective passed</text>
<polyline points="240,109 285,109" fill="none" stroke="#455665" stroke-width="3" stroke-linejoin="round"/>
<polygon points="285,109 275,103 275,115" fill="#455665"/>
<polyline points="625,109 670,109" fill="none" stroke="#455665" stroke-width="3" stroke-linejoin="round"/>
<polygon points="670,109 660,103 660,115" fill="#455665"/>
<polyline points="975,109 1030,109" fill="none" stroke="#455665" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1030,109 1020,103 1020,115" fill="#455665"/>
<polyline points="820,165 820,210 455,210 455,165" fill="none" stroke="#455665" stroke-width="3" stroke-linejoin="round"/>
<polygon points="455,165 449,175 461,175" fill="#455665"/>
<text x="641" y="191" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">More objectives: continue</text>
<rect x="140" y="265" width="310" height="88" rx="10" fill="#FFF1EF" stroke="#AD625A" stroke-width="2"/>
<text x="295.0" y="292" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#142636">PLAYER DIES</text>
<text x="295.0" y="326" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">At any active objective</text>
<rect x="535" y="265" width="600" height="88" rx="10" fill="#F0F5FA" stroke="#557A99" stroke-width="2"/>
<text x="835.0" y="292" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#142636">RETRY</text>
<text x="835.0" y="326" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#142636">Restore latest checkpoint; start if none</text>
<polyline points="450,309 535,309" fill="none" stroke="#9C554D" stroke-width="3" stroke-linejoin="round"/>
<polygon points="535,309 525,303 525,315" fill="#9C554D"/>
<polyline points="835,353 835,388 9,388 9,109 25,109" fill="none" stroke="#455665" stroke-width="3" stroke-linejoin="round"/>
<polygon points="25,109 15,103 15,115" fill="#455665"/>
</svg>
